[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillgraph"
dynamic = ["version"]
description = "Bayesian skill ratings (TrueSkill 1; TrueSkill 2 in progress) via expectation propagation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "mpmath>=1.2", "ruff>=0.5", "mypy>=1.8"]

[tool.hatch.version]
path = "src/skillgraph/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/skillgraph"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: oracle and simulation tests (skip with -m 'not slow')"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
